{% extends "base.html" %}

{% block title %}404 - Page Not Found - JobPortal{% endblock %}

{% block content %}
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="display-1 fw-bold text-danger mb-3">404</div>
            <h1 class="display-4 fw-bold mb-3">Page Not Found</h1>
            <p class="lead text-muted mb-4">Sorry, the page you're looking for doesn't exist or has been moved.</p>
            
            <div class="mb-4">
                <i class="fas fa-search" style="font-size: 4rem; color: #ccc;"></i>
            </div>

            <a href="/" class="btn btn-primary btn-lg me-2">
                <i class="fas fa-home"></i> Go Home
            </a>
            <a href="/jobs" class="btn btn-outline-primary btn-lg">
                <i class="fas fa-briefcase"></i> Browse Jobs
            </a>
        </div>
    </div>
</div>
{% endblock %}
